name: Unzip uploads
on:
  push:
    paths: ['**.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zips
        run: |
          shopt -s globstar nullglob
          for z in **/*.zip; do
            unzip -o "$z" -x "__MACOSX/*"
            git rm -f "$z"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract zip"
          git push
